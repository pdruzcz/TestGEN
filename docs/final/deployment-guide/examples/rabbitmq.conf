# =============================================================================
# RabbitMQ 3.12+ — konfiguracja produkcyjna TestGEN
# =============================================================================

# --- Limity pamieci ---
# Alarm przy 60% RAM — RabbitMQ wstrzymuje przyjmowanie wiadomosci
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.8

# Alarm dyskowy — min. 1.5x wolnej pamieci
disk_free_limit.relative = 1.5

# --- Logowanie ---
log.console = true
log.console.level = warning
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.count = 7

# --- Management plugin ---
management.tcp.port = 15672
# Ograniczenie dostepu do management (opcjonalne):
# management.tcp.ip = 127.0.0.1

# --- Limity polaczen ---
channel_max = 128
heartbeat = 60

# --- Rozmiar wiadomosci ---
# Domyslnie 128 MB — wystarczajace dla zadan Celery
max_message_size = 134217728

# --- Wydajnosc ---
# Prefetch dla konsumentow (Celery worker ustawia wlasny)
consumer_timeout = 1800000

# --- Klaster (multi-node) ---
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
# cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
# cluster_formation.k8s.address_type = hostname
