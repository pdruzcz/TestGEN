; =============================================================================
; PgBouncer — pula polaczen PostgreSQL dla TestGEN
; =============================================================================

[databases]
; Format: nazwa_bazy = host=... port=... dbname=...
testgen = host=postgres port=5432 dbname=testgen

[pgbouncer]
; --- Nasluchiwanie ---
listen_addr = 0.0.0.0
listen_port = 6432

; --- Uwierzytelnianie ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Tryb puli ---
; transaction — zalecany dla async SQLAlchemy (asyncpg)
; Kazda transakcja moze uzywac innego polaczenia serwerowego.
pool_mode = transaction

; --- Rozmiary puli ---
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Timeouty ---
server_idle_timeout = 300
client_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120
client_login_timeout = 60

; --- Logowanie ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; --- Administracja ---
admin_users = testgen
