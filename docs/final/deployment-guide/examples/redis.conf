# =============================================================================
# Redis 7 — konfiguracja produkcyjna TestGEN
# =============================================================================

# --- Siec ---
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# --- Bezpieczenstwo ---
# Ustaw silne haslo w produkcji:
# requirepass <silne_haslo>

# Wylaczenie niebezpiecznych komend
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""

# --- Pamiec ---
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# --- Persistence: RDB (snapshoty) ---
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- Persistence: AOF (append-only file) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Logowanie ---
loglevel notice
logfile ""

# --- Limity ---
maxclients 10000
