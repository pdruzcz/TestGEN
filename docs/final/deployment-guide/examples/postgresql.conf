# =============================================================================
# PostgreSQL 16 — konfiguracja produkcyjna TestGEN
# =============================================================================
# Dostosowana do maszyny 8 GB RAM / 4 vCPU.
# Dla wiekszych maszyn skaluj proporcjonalnie (shared_buffers = 25% RAM).
# =============================================================================

# --- Polaczenia ---
listen_addresses = '*'
port = 5432
max_connections = 200

# --- Pamiec ---
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 64MB
maintenance_work_mem = 512MB
huge_pages = try

# --- WAL i checkpoint ---
wal_buffers = 64MB
checkpoint_completion_target = 0.9
min_wal_size = 1GB
max_wal_size = 4GB
wal_level = replica

# --- Archiwizacja WAL (wymagane dla PITR backup) ---
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/archive/%f'

# --- Optymalizator ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Rownolegle zapytania ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Logowanie ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a '

# --- Locale ---
lc_messages = 'en_US.utf8'
lc_monetary = 'pl_PL.utf8'
lc_numeric = 'pl_PL.utf8'
lc_time = 'pl_PL.utf8'
