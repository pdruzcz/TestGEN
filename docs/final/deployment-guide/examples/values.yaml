# =============================================================================
# TestGEN Helm Chart — values.yaml (domyslna konfiguracja)
# =============================================================================
# Nadpisz wartosci w values-production.yaml lub przez --set.

global:
  domain: testgen.example.com
  imagePullPolicy: IfNotPresent

# --- Sekrety ---
secrets:
  # Uzyj istniejacego sekretu Kubernetes zamiast tworzenia nowego
  existingSecret: ""
  # Jesli existingSecret jest pusty, chart utworzy Secret z ponizszych wartosci
  # (NIE COMMITUJ do repozytorium!)
  secretKey: "change-me-in-production"
  postgresPassword: "change-me"
  rabbitmqPassword: "change-me"
  minioRootPassword: "change-me"
  encryptionKey: ""

# --- Backend (FastAPI) ---
backend:
  replicaCount: 2
  image:
    repository: registry.example.com/testgen/backend
    tag: latest
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  env:
    APP_ENV: production
    DEBUG: "false"
    ENGINE_MODE: hybrid
    BACKEND_PORT: "8000"
  service:
    port: 8000
  healthcheck:
    path: /api/v1/health
    initialDelaySeconds: 15
    periodSeconds: 30

# --- Frontend (nginx + Angular SPA) ---
frontend:
  replicaCount: 2
  image:
    repository: registry.example.com/testgen/frontend
    tag: latest
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    port: 80

# --- Celery Worker ---
celeryWorker:
  replicaCount: 2
  image:
    repository: registry.example.com/testgen/backend
    tag: latest
  command:
    - celery
    - -A
    - app.workers.celery_app
    - worker
    - --loglevel=info
    - -Q
    - default,analysis,export,security
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 75

# --- Celery Beat ---
celeryBeat:
  replicaCount: 1
  image:
    repository: registry.example.com/testgen/backend
    tag: latest
  command:
    - celery
    - -A
    - app.workers.celery_app
    - beat
    - --loglevel=info
    - --schedule=/tmp/celerybeat-schedule
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# --- Flower (monitoring Celery) ---
flower:
  enabled: true
  replicaCount: 1
  image:
    repository: mher/flower
    tag: "2.0"
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    port: 5555

# --- PostgreSQL ---
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  persistence:
    enabled: true
    storageClass: ssd
    size: 100Gi
  service:
    port: 5432

# --- Redis ---
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  persistence:
    enabled: true
    storageClass: ssd
    size: 10Gi
  service:
    port: 6379

# --- RabbitMQ ---
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 3.12-management-alpine
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  persistence:
    enabled: true
    storageClass: ssd
    size: 20Gi
  service:
    amqpPort: 5672
    managementPort: 15672

# --- MinIO ---
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  persistence:
    enabled: true
    storageClass: standard
    size: 500Gi
  service:
    apiPort: 9000
    consolePort: 9001

# --- Ingress ---
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
  tls:
    enabled: true
    secretName: testgen-tls
  hosts:
    - host: testgen.example.com
      paths:
        - path: /api/
          pathType: Prefix
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80

# --- HPA (backend) ---
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilization: 70
  targetMemoryUtilization: 80
