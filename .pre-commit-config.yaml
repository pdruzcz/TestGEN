repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.20.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(ts|html)$
        additional_dependencies:
          - eslint@9
          - typescript-eslint@8
          - angular-eslint@19

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|html|scss|json)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.pen$
      - id: end-of-file-fixer
        # .pen (pen.dev) — plik zarządzany przez edytor (JSON + fileToken);
        # dopisywanie newline na końcu zmieniałyby bajt w bajt plik narzędzia.
        exclude: \.pen$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
        # Artefakty PDF dokumentacji końcowej są z założenia duże (zrzuty
        # ekranu, embed-resources); źródłem prawdy pozostaje markdown +
        # scripts/build_final_docs_pdf.py.
        exclude: ^docs/final/pdf/.*\.pdf$
