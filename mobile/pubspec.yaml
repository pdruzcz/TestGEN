name: testgen_mobile
description: TestGEN — mobile/desktop WebView shell for Angular frontend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ^3.38.0

dependencies:
  app_links: ^6.4.0
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  webview_flutter: ^4.12.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Ikona launchera ze znaku TestGEN (frontend/assets/logo.svg → mobile/assets).
# Regeneracja po zmianie grafiki: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon-foreground.png

flutter:
  uses-material-design: true
