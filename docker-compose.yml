services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      target: production
    command: celery -A app.workers.celery_app worker --loglevel=info -Q default,analysis,export,security,email,webhooks,sync
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Harmonogram zadań okresowych (beat_schedule w app/workers/celery_app.py):
  # renewals/dunning 03:30, usage-snapshot 00:00, progi limitów co godzinę,
  # cleanup 02:00, CVE miesięcznie. Bez tego serwisu żadne zadanie okresowe
  # nie rusza (odnawianie subskrypcji przestaje działać po cichu).
  celery-beat:
    build:
      context: ./backend
      target: production
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    command:
      - celery
      - --broker=amqp://${RABBITMQ_USER:-testgen}:${RABBITMQ_PASSWORD:-testgen_dev_password}@rabbitmq:5672//
      - flower
      - --port=5555
      - --basic-auth=${FLOWER_USER:-floweradmin}:${FLOWER_PASSWORD:-flower_dev_password}
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import socket,sys; sys.exit(0 if socket.create_connection(("localhost",5555),3) else 1)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testgen_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-testgen}
    ports:
      # Tylko mapowanie na hosta — w sieci compose usługi łączą się przez
      # postgres:5432. Osobna zmienna, bo POSTGRES_PORT opisuje port
      # wewnętrzny i jego zmiana zerwałaby DATABASE_URL.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testgen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-testgen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-testgen_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-testgen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-testgen_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
