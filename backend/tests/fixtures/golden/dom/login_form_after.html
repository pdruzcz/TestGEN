<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Logowanie — wersja B (po refaktoryzacji)</title>
</head>
<body>
  <main>
    <!-- Wersja "po": usunięto legacy id przycisku, dodano data-testid. -->
    <form aria-label="Formularz logowania">
      <h1>Logowanie</h1>

      <label for="email">Adres e-mail</label>
      <input name="email" type="email" data-testid="email-input" required />

      <label for="password">Hasło</label>
      <input
        name="password"
        type="password"
        data-testid="password-input"
        required
      />

      <label>
        <input type="checkbox" name="remember" data-testid="remember-me" />
        Zapamiętaj mnie
      </label>

      <button type="submit" data-testid="login-submit">Zaloguj</button>

      <a href="/reset" data-testid="reset-password">Nie pamiętam hasła</a>
    </form>
  </main>
</body>
</html>
