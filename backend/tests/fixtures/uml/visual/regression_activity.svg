<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>
  <!-- Start (topological root + label) -->
  <rect x="250" y="20" width="100" height="40" fill="none" stroke="black"/>
  <text x="300" y="45" text-anchor="middle">Start</text>
  <!-- Action -->
  <rect x="250" y="100" width="100" height="40" fill="none" stroke="black"/>
  <text x="300" y="125" text-anchor="middle">Process</text>
  <!-- Decision -->
  <polygon points="300,170 360,210 300,250 240,210" fill="none" stroke="black"/>
  <text x="300" y="215" text-anchor="middle">valid?</text>
  <!-- Stop (topological sink + label) -->
  <rect x="250" y="290" width="100" height="40" fill="none" stroke="black"/>
  <text x="300" y="315" text-anchor="middle">Stop</text>
  <!-- Connectors: Start -> Process -> valid? -> Stop (+ retry loop valid? -> Process) -->
  <line x1="300" y1="60" x2="300" y2="100" stroke="black" marker-end="url(#arrow)"/>
  <line x1="300" y1="140" x2="300" y2="170" stroke="black" marker-end="url(#arrow)"/>
  <line x1="240" y1="210" x2="250" y2="140" stroke="black" marker-end="url(#arrow)"/>
  <line x1="300" y1="250" x2="300" y2="290" stroke="black" marker-end="url(#arrow)"/>
</svg>
