# Golden misconfig fixture (Story 4.14) — hostNetwork enabled (CWE-668).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sniffer
  namespace: production
spec:
  template:
    spec:
      hostNetwork: true
      containers:
        - name: sniffer
          image: registry.example.com/sniffer:0.9.1
          securityContext:
            runAsNonRoot: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
