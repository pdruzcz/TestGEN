# Golden misconfig fixture (Story 4.14) — privileged container (CWE-250).
apiVersion: v1
kind: Pod
metadata:
  name: debug-tools
  namespace: production
spec:
  containers:
    - name: tools
      image: registry.example.com/tools:2.1.0
      securityContext:
        privileged: true
        runAsNonRoot: true
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
        requests:
          cpu: "250m"
          memory: "128Mi"
