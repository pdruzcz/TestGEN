      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file:
      - .env

  flower:
    image: mher/flower:2.0
    command: celery --broker=amqp://${RABBITMQ_USER:-testgen}:${RABBITMQ_PASSWORD:-testgen_dev_password}@rabbitmq:5672// flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      rabbitmq:
        condition: service_healthy
